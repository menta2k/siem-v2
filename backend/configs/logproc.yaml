service:
  name: logproc
  version: 0.1.0
  env: dev

server:
  http_addr: ":8100"
  read_timeout: 30s
  write_timeout: 30s

storage:
  victorialogs:
    hot: "http://localhost:9428"
    warm: "http://localhost:9429"
    raw: "http://localhost:9430"
    account_id: 0
    project_id: 0
  jetstream:
    url: "nats://localhost:4222"
    stream_name: "SIEM_RAW"
    max_age_days: 7
  valkey:
    addrs: ["localhost:56379"]
  postgres:
    dsn_ref: "env:SIEM_PG_DSN"
    max_conns: 20
    min_conns: 2

ingest:
  logpush_secret_ref: "env:SIEM_INGEST_SECRET"
  vector_secret_ref: "env:SIEM_INGEST_SECRET"
  max_body_bytes: 1073741824
  pull_interval: 60s

correlate:
  late_arrival_window: 10m
  heuristic_window: 5s

evaluation:
  wirefilter_url: "http://localhost:8081"
  timeout: 10s
  paranoia_level: 1
  anomaly_threshold: 5
  request_body_limit: 13107200
