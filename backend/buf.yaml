version: v2
modules:
  - path: api
deps:
  - buf.build/googleapis/googleapis
lint:
  use: [STANDARD]
  except:
    # Our HTTP paths are fixed by the published REST contract; renaming RPCs to
    # satisfy the default suffix rules would change the API for style alone.
    - RPC_REQUEST_STANDARD_NAME
    - RPC_RESPONSE_STANDARD_NAME
    - RPC_REQUEST_RESPONSE_UNIQUE
breaking:
  use: [FILE]
