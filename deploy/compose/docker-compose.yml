name: siem-v2

services:
  victorialogs-hot:
    image: victoriametrics/victoria-logs:latest
    restart: unless-stopped
    command:
      - -storageDataPath=/vlogs
      - -retentionPeriod=30d
      - -retention.maxDiskUsagePercent=80
      - -delete.enable                      # required for targeted expiry; see research.md R7
    ports: ["9428:9428"]
    volumes: ["vl-hot:/vlogs"]

  victorialogs-warm:
    image: victoriametrics/victoria-logs:latest
    restart: unless-stopped
    command:
      - -storageDataPath=/vlogs
      - -retentionPeriod=90d
      - -httpListenAddr=:9429
      - -delete.enable
    ports: ["9429:9429"]
    volumes: ["vl-warm:/vlogs"]

  victorialogs-raw:
    image: victoriametrics/victoria-logs:latest
    restart: unless-stopped
    command:
      - -storageDataPath=/vlogs
      # Raw provider evidence carries its own, shorter retention. The instance
      # flag is a ceiling; the UI-configurable window (default 7d) is enforced
      # within it by retentiond's scheduled delete task, which needs
      # -delete.enable. RAW_RETENTION_MAX_DAYS caps how long anything can live.
      - -retentionPeriod=${RAW_RETENTION_MAX_DAYS:-30}d
      - -httpListenAddr=:9430
      - -delete.enable
    ports: ["9430:9430"]
    volumes: ["vl-raw:/vlogs"]

  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    # Credentials come from .env (see .env.example); the defaults keep a bare
    # `docker compose up` working for local development and are obviously
    # dev-only values, never production ones.
    environment:
      POSTGRES_USER: ${SIEM_PG_USER:-siem}
      POSTGRES_PASSWORD: ${SIEM_PG_PASSWORD:-siem_dev_only}
      POSTGRES_DB: ${SIEM_PG_DB:-siem}
    ports: ["55432:5432"]   # host port shifted: 5432 is taken by another local stack
    volumes: ["pg:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER}"]
      interval: 5s

  valkey:
    image: valkey/valkey:8-alpine
    restart: unless-stopped
    # appendonly: correlation state must survive restart (FR-023)
    command: ["valkey-server", "--appendonly", "yes", "--appendfsync", "everysec"]
    ports: ["56379:6379"]   # host port shifted: 6379 is taken by another local stack
    volumes: ["valkey:/data"]

  nats:
    image: nats:2-alpine
    restart: unless-stopped
    command: ["-js", "-sd", "/data"]
    ports: ["4222:4222", "8222:8222"]
    volumes: ["nats:/data"]

  rustfs:
    image: rustfs/rustfs:latest
    restart: unless-stopped
    environment:
      RUSTFS_ACCESS_KEY: ${SIEM_S3_ACCESS_KEY:-siem_dev}
      RUSTFS_SECRET_KEY: ${SIEM_S3_SECRET_KEY:-siem_dev_only}
    ports: ["9000:9000"]
    volumes: ["rustfs:/data"]

  wirefilter-svc:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile.wirefilter
    restart: unless-stopped
    ports: ["8081:8081"]

  # ---------------------------------------------------------------- app services
  #
  # The application, behind an `app` profile so the default `up` stays the
  # infra-only stack for host-run development (binaries on :8000/:8100/:3002
  # would collide with these published ports). Full stack in containers:
  #
  #     docker compose --profile app up -d --build
  #
  # Configs are the container-network variants from ./configs; secrets follow
  # the same .env-with-dev-defaults pattern as the credentials above. On first
  # start the apiserver logs the bootstrap admin's one-time setup link:
  #
  #     docker compose logs apiserver | grep BOOTSTRAP
  apiserver:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile.backend
      args: { SERVICE: apiserver }
    profiles: ["app"]
    restart: unless-stopped
    command: ["--conf", "/etc/siem/apiserver.yaml"]
    environment:
      SIEM_PG_DSN: postgres://${SIEM_PG_USER:-siem}:${SIEM_PG_PASSWORD:-siem_dev_only}@postgres:5432/${SIEM_PG_DB:-siem}?sslmode=disable
      SIEM_JWT_KEY: ${SIEM_JWT_KEY:-dev-jwt-signing-key-32-bytes-min!}
      # Must be EXACTLY 32 bytes; the service refuses to start otherwise.
      SIEM_MFA_KEY: ${SIEM_MFA_KEY:-dev-mfa-sealing-key-32-bytes-ex!}
      SIEM_INGEST_SECRET: ${SIEM_INGEST_SECRET:-dev-secret}
      SIEM_CORS_ORIGINS: ${SIEM_CORS_ORIGINS:-http://localhost:3002}
      SIEM_ADMIN_EMAIL: ${SIEM_ADMIN_EMAIL:-admin@siem.local}
    volumes:
      - ./configs/apiserver.yaml:/etc/siem/apiserver.yaml:ro
    ports: ["8000:8000"]
    depends_on:
      postgres: { condition: service_healthy }
      victorialogs-hot: { condition: service_started }
      valkey: { condition: service_started }
      wirefilter-svc: { condition: service_started }

  logproc:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile.backend
      args: { SERVICE: logproc }
    profiles: ["app"]
    restart: unless-stopped
    command: ["--conf", "/etc/siem/logproc.yaml"]
    environment:
      SIEM_PG_DSN: postgres://${SIEM_PG_USER:-siem}:${SIEM_PG_PASSWORD:-siem_dev_only}@postgres:5432/${SIEM_PG_DB:-siem}?sslmode=disable
      SIEM_INGEST_SECRET: ${SIEM_INGEST_SECRET:-dev-secret}
    volumes:
      - ./configs/logproc.yaml:/etc/siem/logproc.yaml:ro
    ports: ["8100:8100"]
    depends_on:
      postgres: { condition: service_healthy }
      victorialogs-hot: { condition: service_started }
      victorialogs-raw: { condition: service_started }
      nats: { condition: service_started }

  retentiond:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile.backend
      args: { SERVICE: retentiond }
    profiles: ["app"]
    restart: unless-stopped
    command: ["--conf", "/etc/siem/retentiond.yaml"]
    environment:
      SIEM_PG_DSN: postgres://${SIEM_PG_USER:-siem}:${SIEM_PG_PASSWORD:-siem_dev_only}@postgres:5432/${SIEM_PG_DB:-siem}?sslmode=disable
      SIEM_S3_ACCESS_KEY: ${SIEM_S3_ACCESS_KEY:-siem_dev}
      SIEM_S3_SECRET_KEY: ${SIEM_S3_SECRET_KEY:-siem_dev_only}
    volumes:
      - ./configs/retentiond.yaml:/etc/siem/retentiond.yaml:ro
    depends_on:
      postgres: { condition: service_healthy }
      victorialogs-raw: { condition: service_started }
      rustfs: { condition: service_started }

  profilerd:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile.backend
      args: { SERVICE: profilerd }
    profiles: ["app"]
    restart: unless-stopped
    command: ["--conf", "/etc/siem/profilerd.yaml"]
    environment:
      SIEM_PG_DSN: postgres://${SIEM_PG_USER:-siem}:${SIEM_PG_PASSWORD:-siem_dev_only}@postgres:5432/${SIEM_PG_DB:-siem}?sslmode=disable
    volumes:
      - ./configs/profilerd.yaml:/etc/siem/profilerd.yaml:ro
    ports: ["8300:8300"]
    depends_on:
      postgres: { condition: service_healthy }
      nats: { condition: service_started }

  frontend:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile.frontend
    profiles: ["app"]
    restart: unless-stopped
    # Runtime configuration, read by Nuxt at start: these are BROWSER-facing
    # URLs, so they use host-published ports, not service names.
    environment:
      NUXT_PUBLIC_API_BASE: ${NUXT_PUBLIC_API_BASE:-http://localhost:8000/api/v1}
      NUXT_PUBLIC_INGEST_BASE: ${NUXT_PUBLIC_INGEST_BASE:-http://localhost:8100}
    ports: ["3002:3000"]
    depends_on:
      apiserver: { condition: service_started }

  # ---------------------------------------------------------------- F5 collector
  #
  # BIG-IP ASM can only ship logs over syslog — a Logging Profile offers TCP,
  # UDP and TCP-RFC3195, never HTTP — so this translates syslog into
  # authenticated HTTP (v1's BIG-IP collector pattern).
  #
  # It reaches logproc over the COMPOSE NETWORK, not through Cloudflare: once a
  # log line is on this host there is no reason to send it to the edge and back.
  #
  # The syslog port is an unauthenticated inbound port — anything that can
  # reach it can forge WAF events into the SIEM. Restrict it to BIG-IP's
  # address at the firewall; F5_SYSLOG_BIND alone only chooses an interface,
  # it does not filter callers.
  #
  #     F5_FEED_ID=<feed-id> F5_FEED_TOKEN=<token> \
  #         docker compose --profile app --profile f5 up -d
  vector-f5:
    image: timberio/vector:0.44.0-alpine
    profiles: ["f5"]
    restart: unless-stopped
    # The image's default command loads ITS OWN /etc/vector/vector.yaml — a
    # demo pipeline that prints joke syslog to the console. Without this
    # override the mounted config is simply never read, and the collector
    # looks alive while shipping nothing.
    command: ["--config", "/etc/vector/vector.toml"]
    environment:
      # Plain interpolation, NOT `:?` (v1 lesson): compose evaluates `:?` for
      # every service at parse time, breaking ps/logs/exec on hosts not running
      # this profile. The vector config declares the variables required
      # instead, so the container refuses to start rather than dropping.
      SIEM_INGEST_URL: http://logproc:8100/ingest/v1/f5asm/${F5_FEED_ID-}
      SIEM_FEED_TOKEN: ${F5_FEED_TOKEN-}
      # The BIG-IP appliance's UTC offset (e.g. "+0300"): its logs carry local
      # time with no offset, and without this every F5 event lands hours in
      # the future. +0000 leaves an already-UTC appliance untouched.
      BIGIP_UTC_OFFSET: ${BIGIP_UTC_OFFSET:-+0000}
    ports:
      - "${F5_SYSLOG_BIND:-127.0.0.1}:${F5_SYSLOG_PORT:-5514}:5514"
    volumes:
      - ../vector/f5asm.toml:/etc/vector/vector.toml:ro
      # The disk buffer is the no-loss guarantee; it must outlive the container.
      - vector-f5:/var/lib/vector
    # required:false — the collector can also point at a host-run logproc,
    # and a profile-f5-only `up` must not force the app profile in.
    depends_on:
      logproc: { condition: service_started, required: false }

  # Cloudflare Tunnel (ported from v1). cloudflared dials OUT to Cloudflare and serves
  # over that connection, so the origin needs no inbound port, no public address and no
  # certificate of its own — and cannot return a 522, because there is nothing for
  # Cloudflare to fail to reach. This is also what lets a Logpush feed deliver to
  # /ingest/v1/cloudflare/<feed-id> on a machine with no public IP.
  #
  # Public Hostname origins depend on where the app runs. With the `app`
  # profile (services in containers), use service names and CONTAINER ports —
  # the frontend listens on 3000 inside; 3002 exists only on the host:
  #
  #     siem.example.com  path api/*     ->  http://apiserver:8000
  #     siem.example.com  path ingest/*  ->  http://logproc:8100
  #     siem.example.com  (catch-all)    ->  http://frontend:3000
  #
  # One hostname with path rules keeps console and API same-origin, so the
  # __Host- refresh cookie and CORS need no cross-origin care. With the app
  # services run on the HOST instead, point at host.docker.internal:3002 /
  # :8000 / :8100 (the host-gateway mapping below makes that name work).
  #
  # Enabled with a profile so the stack still starts without a token; a cloudflared with
  # no credentials would otherwise crash-loop and bury the real logs:
  #
  #     CLOUDFLARE_TUNNEL_TOKEN=... docker compose --profile tunnel up -d
  cloudflared:
    image: cloudflare/cloudflared:2026.7.3
    profiles: ["tunnel"]
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      # Plain interpolation, not `:?`: that check is evaluated for every service at
      # parse time, so requiring the token here would break `compose ps`, `logs` and
      # `exec` on any host not running the tunnel. The profile keeps this out of a
      # default `up`, and cloudflared exits loudly on an empty token.
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN-}
    # host.docker.internal is automatic on Docker Desktop but not on Linux; the
    # host-gateway mapping makes the same name work everywhere.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # Outbound only. Deliberately no ports: publishing one would defeat the point.

volumes:
  vector-f5:
  vl-hot:
  vl-warm:
  vl-raw:
  pg:
  valkey:
  nats:
  rustfs:
