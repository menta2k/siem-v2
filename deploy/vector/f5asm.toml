# Vector pipeline: F5 BIG-IP ASM remote logging (syslog) → SIEM ingest.
#
# ASM's logging profile should use the Key-Value Pairs format (least parsing
# ambiguity) and include the captured request, which is where CF-Ray is
# recovered from when the profile cannot emit it as its own field — see
# docs/connecting-vendors.md for the iRule.
#
# Same durability posture as the nginx pipeline: disk buffer plus end-to-end
# acknowledgements, because a syslog datagram Vector accepted and then lost is
# invisible to everyone.

[sources.f5_syslog]
# A raw socket, NOT the syslog codec (v1's choice, relearned here): the syslog
# decoder REJECTS frames that are not valid UTF-8, and ASM's captured request
# bodies contain raw binary precisely on the interesting events — exploit
# payloads. The raw socket keeps the line (lossy-decoded) instead of dropping
# it; the SIEM's parser scrapes key="value" pairs past the syslog header.
type = "socket"
address = "0.0.0.0:5514"
mode = "tcp"   # TCP, not UDP: ASM supports it and datagram loss is silent
framing.method = "newline_delimited"

[transforms.f5_passthrough]
type = "remap"
inputs = ["f5_syslog"]
# The SIEM's own parser handles the key-value format; Vector only strips the
# syslog framing and forwards the message body untouched, so the ORIGINAL bytes
# reach the dead-letter store when parsing fails downstream.
source = '''
. = { "message": string!(.message) }
'''

[sinks.siem_ingest]
type = "http"
inputs = ["f5_passthrough"]
# Both values come from the environment WITHOUT defaults on purpose: Vector
# refuses to start on a missing variable, which beats silently delivering to
# nowhere. SIEM_INGEST_URL is the full feed endpoint, e.g.
#   http://logproc:8100/ingest/v1/f5asm/<feed-id>   (inside the compose network)
#   https://siem.example.com/ingest/v1/f5asm/<feed-id>  (standalone host)
uri = "${SIEM_INGEST_URL}"
method = "post"
encoding.codec = "text"
framing.method = "newline_delimited"
compression = "gzip"
auth.strategy = "bearer"
auth.token = "${SIEM_FEED_TOKEN}"
acknowledgements.enabled = true

  [sinks.siem_ingest.buffer]
  type = "disk"
  max_size = 1073741824
  when_full = "block"

  [sinks.siem_ingest.request]
  retry_attempts = 1000000
  retry_max_duration_secs = 300
